<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121211">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Fitness — registro de entrenamiento, hábitos y progreso">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Fitness">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Fitness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* ==========================================================================
   VForm — Design tokens
   ========================================================================== */
:root {
  /* Bitácora — grafito, hueso y un solo acento */
  --bg: #121211;
  --surface: #121211;
  --elev: #1C1B19;
  --line: #2E2C29;
  --line-strong: #3A3834;
  --text: #EDE8DF;
  --dim: #8F8A82;
  --faint: #6E6A64;

  /* Un único acento. Los nombres viejos quedan como alias para no tocar la lógica */
  --accent: #FF5A1F;
  --mint: var(--accent);
  --violet: var(--text);
  --coral: var(--accent);
  --amber: var(--text);
  --red: #FF5D5D;
  --green: #4ADE80;

  --mint-dim: rgba(255,90,31,.12);
  --violet-dim: rgba(237,232,223,.08);
  --coral-dim: rgba(255,90,31,.12);
  --amber-dim: rgba(237,232,223,.08);

  --radius: 0px;
  --radius-s: 0px;
  --pad: 18px;
  --nav-h: 68px;
  --font: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;

  --ease: cubic-bezier(.22,.9,.3,1);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { color-scheme: dark; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; border-radius: 6px; }
svg { display: block; }

/* ==========================================================================
   App shell
   ========================================================================== */
#app {
  max-width: 560px;
  margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 22px) var(--pad) calc(var(--nav-h) + env(safe-area-inset-bottom) + 28px);
  min-height: 100dvh;
}

/* Navegación inferior */
nav.tabbar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: rgba(11,11,15,.82);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: center;
  z-index: 50;
}
nav.tabbar .tabs { display: flex; width: 100%; max-width: 560px; }
nav.tabbar button {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px;
  color: var(--faint);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .02em;
  transition: color .25s var(--ease);
}
nav.tabbar button svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabbar button.active { color: var(--text); }
nav.tabbar button.active svg { stroke: var(--mint); }

/* Escritorio: la barra pasa a sidebar */
@media (min-width: 900px) {
  #app { max-width: 640px; margin-left: calc(50% - 200px); padding-top: 48px; }
  nav.tabbar {
    top: 0; bottom: auto; left: calc(50% - 480px); right: auto;
    width: 190px; height: 100dvh;
    border-top: none; border-right: 1px solid var(--line);
    background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none;
    align-items: flex-start; padding-top: 56px;
  }
  nav.tabbar .tabs { flex-direction: column; gap: 6px; padding: 0 14px; }
  nav.tabbar button { flex: none; flex-direction: row; justify-content: flex-start; gap: 12px; width: 100%; padding: 11px 14px; border-radius: 12px; font-size: 14px; }
  nav.tabbar button.active { background: var(--surface); }
}
@media (min-width: 900px) and (max-width: 1180px) {
  nav.tabbar { left: 0; }
  #app { margin-left: 230px; }
}

/* ==========================================================================
   Primitivas
   ========================================================================== */
.screen { animation: rise .45s var(--ease) both; }
.screen.still { animation: none; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: var(--pad);
  margin-bottom: 14px;
}
.card + h2 { margin-top: 30px; }


/* ---- Cámara con guía ---- */
#cam { position: fixed; inset: 0; z-index: 9998; background: #000; color: #F2EFE6; display: flex; flex-direction: column; }
#cam .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; flex-wrap: wrap; }
#cam .bar button, #cam .seg2 button { background: rgba(255,255,255,.12); color: #F2EFE6; border: 1px solid rgba(255,255,255,.25); border-radius: 8px; padding: 8px 12px; font: inherit; font-size: 13px; min-height: 40px; }
#cam .bar button.on, #cam .seg2 button.on { background: #FF5A1F; color: #161616; border-color: #FF5A1F; }
#cam .stage { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 0 8px; }
#cam .frame { position: relative; max-width: 100%; max-height: 100%; background: #111; overflow: hidden; }
#cam .frame video, #cam .frame img.shot { display: block; width: 100%; height: 100%; object-fit: cover; }
#cam .frame img.ghost { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .35; pointer-events: none; }
#cam .frame svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#cam .count { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 140px; font-weight: 700; color: #fff; text-shadow: 0 4px 24px rgba(0,0,0,.7); pointer-events: none; }
#cam .foot { padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
#cam .seg2 { display: flex; gap: 6px; }
#cam .shutter { width: 76px; height: 76px; border-radius: 50%; border: 5px solid #F2EFE6; background: #FF5A1F; padding: 0; }
#cam .hint { text-align: center; font-size: 12px; color: rgba(242,239,230,.7); padding: 0 16px 4px; }
img.logo { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; flex: none; border: 2px solid #FF5A1F; }
h1.greet { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
.sub { color: var(--dim); font-size: 14px; margin-top: 2px; }

h2 {
  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em;
  color: var(--dim); margin: 26px 0 12px 4px;
}

.eyebrow { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--dim); }

/* Métrica héroe: número grande + unidad chica */
.metric { display: flex; align-items: baseline; gap: 5px; }
.metric .n { font-size: 34px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1; }
.metric .u { font-size: 13px; font-weight: 600; color: var(--dim); }
.metric.xl .n { font-size: 46px; }

.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 11px; border-radius: 999px;
  font-size: 12px; font-weight: 600;
  background: var(--elev); color: var(--dim);
}
.pill.up { background: rgba(74,222,128,.13); color: var(--green); }
.pill.down { background: rgba(255,93,93,.13); color: var(--red); }
.pill.flat { background: var(--elev); color: var(--dim); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 13px 20px; border-radius: 14px;
  font-size: 15px; font-weight: 650;
  background: var(--text); color: #0B0B0F;
  transition: transform .15s var(--ease), opacity .2s;
  width: 100%;
}
.btn:active { transform: scale(.97); }
.btn.ghost { background: var(--elev); color: var(--text); border: 1px solid var(--line-strong); }
.btn.mint { background: var(--mint); color: #06231A; }
.btn.violet { background: var(--violet); color: #17103A; }
.btn.small { padding: 8px 14px; font-size: 13px; width: auto; border-radius: 11px; }
.btn.danger { background: rgba(255,93,93,.12); color: var(--red); }
.btn[disabled] { opacity: .4; pointer-events: none; }

/* Inputs */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; font-weight: 650; color: var(--dim); margin-bottom: 6px; }
.field input, .field textarea, .field select {
  width: 100%; background: var(--elev); border: 1px solid var(--line-strong);
  border-radius: 12px; padding: 12px 14px; font-size: 16px;
}
.field textarea { resize: vertical; min-height: 64px; }

/* Steppers numéricos para series */
.stepper { display: flex; align-items: center; gap: 0; background: var(--elev); border: 1px solid var(--line-strong); border-radius: 12px; overflow: hidden; }
.stepper button { width: 42px; height: 44px; font-size: 20px; color: var(--dim); flex-shrink: 0; }
.stepper button:active { background: rgba(255,255,255,.06); }
.stepper input { width: 100%; text-align: center; background: none; border: none; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; padding: 0; -moz-appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; }

/* Anillos */
.rings { display: flex; justify-content: space-around; gap: 8px; }
.ring-item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.ring-item .lbl { font-size: 11px; font-weight: 650; color: var(--dim); letter-spacing: .04em; }
.ring-wrap { position: relative; }
.ring-wrap .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-wrap .center .v { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.ring-wrap .center .s { font-size: 9.5px; color: var(--dim); font-weight: 600; }
.ring-track { stroke: rgba(255,255,255,.08); }
.ring-fill { transition: stroke-dashoffset 1s var(--ease); }

/* Camino a la dominada (elemento firma) */
.rail { position: relative; padding: 6px 0 2px; }
.rail .track { position: absolute; top: 15px; left: 12px; right: 12px; height: 3px; background: var(--elev); border-radius: 2px; }
.rail .fill { position: absolute; top: 15px; left: 12px; height: 3px; background: linear-gradient(90deg, var(--violet), var(--mint)); border-radius: 2px; transition: width 1s var(--ease); }
.rail .stages { display: flex; justify-content: space-between; position: relative; }
.rail .stage { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 25%; }
.rail .dot {
  width: 27px; height: 27px; border-radius: 50%;
  background: var(--elev); border: 2px solid var(--line-strong);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; transition: all .4s var(--ease);
  position: relative; z-index: 1;
}
.rail .stage.done .dot { background: var(--violet); border-color: var(--violet); color: #17103A; }
.rail .stage.now .dot { border-color: var(--violet); box-shadow: 0 0 0 5px var(--violet-dim); }
.rail .stage .t { font-size: 10.5px; font-weight: 650; color: var(--faint); text-align: center; line-height: 1.25; }
.rail .stage.now .t { color: var(--text); }
.rail .stage.done .t { color: var(--dim); }

/* Listas de ejercicios / comidas / hábitos */
.item {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 2px; border-bottom: 1px solid var(--line);
}
.item:last-child { border-bottom: none; }
.item .ico {
  width: 40px; height: 40px; border-radius: 13px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 18px;
  background: var(--elev);
}
.item .body { flex: 1; min-width: 0; }
.item .name { font-size: 15px; font-weight: 650; }
.item .meta { font-size: 12.5px; color: var(--dim); margin-top: 1px; }
.item .end { flex-shrink: 0; }

/* Check circular */
.check {
  width: 30px; height: 30px; border-radius: 50%;
  border: 2px solid var(--line-strong);
  display: flex; align-items: center; justify-content: center;
  transition: all .25s var(--ease);
  color: transparent;
}
.check svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.check.on { background: var(--mint); border-color: var(--mint); color: #06231A; }
.check.on.amber { background: var(--amber); border-color: var(--amber); color: #3A2B08; }
.check.on.bad { background: var(--red); border-color: var(--red); color: #fff; }

/* Segmented control */
.seg { display: flex; background: var(--elev); border-radius: 12px; padding: 3px; gap: 3px; margin-bottom: 16px; }
.seg button { flex: 1; padding: 9px 6px; border-radius: 9px; font-size: 13px; font-weight: 650; color: var(--dim); transition: all .25s var(--ease); }
.seg button.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 6px rgba(0,0,0,.35); }

/* Serie registrada */
.setrow { display: grid; grid-template-columns: 30px 1fr 1fr; gap: 10px; align-items: center; margin-bottom: 9px; }
.setrow.timed { grid-template-columns: 30px 1fr; }
.setrow .idx { font-size: 12px; font-weight: 700; color: var(--faint); text-align: center; font-variant-numeric: tabular-nums; }

/* Gráficos */
.chart { width: 100%; height: auto; }
.chart .axis { stroke: rgba(255,255,255,.07); stroke-width: 1; }
.chart text { fill: var(--faint); font-size: 10px; font-family: var(--font); font-variant-numeric: tabular-nums; }
.chart .lbl-end { text-anchor: end; }

/* IMC */
.bmi svg { width: 100%; height: auto; display: block; }
.bmi .zone { transition: opacity .3s; }
.bmi-rows { margin-top: 14px; border-top: 1px dashed var(--line-strong); }
.bmi-row { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: baseline; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.bmi-row .mk { color: var(--accent); font-size: 10px; }
.bmi-row.on { color: var(--text); }
.bmi-row .kg { color: var(--faint); }
.bmi-row.on .kg { color: var(--dim); }

/* Modal */
.modal-root { position: fixed; inset: 0; z-index: 100; display: none; }
.modal-root.open { display: block; }
.modal-root .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); animation: fade .25s both; }
@keyframes fade { from { opacity: 0; } }
.modal-root .sheet {
  position: absolute; bottom: 0; left: 0; right: 0;
  max-width: 560px; margin: 0 auto;
  background: var(--surface); border: 1px solid var(--line-strong); border-bottom: none;
  border-radius: 24px 24px 0 0;
  padding: 14px 20px calc(24px + env(safe-area-inset-bottom));
  max-height: 88dvh; overflow-y: auto; overscroll-behavior: contain;
  animation: sheetUp .4s var(--ease) backwards;   /* sin "forwards": si no, la animación pisa el transform del arrastre */
}
@keyframes sheetUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--line-strong); margin: 0 auto 16px; position: relative; touch-action: none; }
.sheet .grab::before { content: ""; position: absolute; left: -40px; right: -40px; top: -14px; bottom: -14px; }
.sheet h3 { font-size: 19px; font-weight: 700; letter-spacing: -.01em; margin-bottom: 16px; }

/* Toast */
#toast {
  position: fixed; left: 50%; bottom: calc(var(--nav-h) + 22px + env(safe-area-inset-bottom));
  transform: translateX(-50%) translateY(12px);
  background: var(--elev); border: 1px solid var(--line-strong);
  border-radius: 999px; padding: 10px 20px;
  font-size: 14px; font-weight: 600;
  opacity: 0; pointer-events: none;
  transition: all .3s var(--ease);
  z-index: 200; white-space: nowrap;
  box-shadow: 0 8px 30px rgba(0,0,0,.5);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Mensajes de coach */
.coach {
  border-left: 3px solid var(--mint);
  padding: 2px 0 2px 14px;
  margin: 18px 0 4px;
  font-size: 15px; line-height: 1.5; color: var(--text);
}
.coach em { color: var(--mint); font-style: normal; font-weight: 650; }

/* Utilidades */
.mt8 { margin-top: 8px; } .mt14 { margin-top: 14px; } .mt20 { margin-top: 20px; }
.dimtext { color: var(--dim); font-size: 13.5px; }
.small { font-size: 12.5px; }
.center { text-align: center; }
.empty { text-align: center; color: var(--faint); padding: 28px 12px; font-size: 14px; }
.tag { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; }
.tag.violet { background: var(--violet-dim); color: var(--violet); }
.tag.mint { background: var(--mint-dim); color: var(--mint); }
.tag.coral { background: var(--coral-dim); color: var(--coral); }
.tag.amber { background: var(--amber-dim); color: var(--amber); }

.photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.photo-grid figure { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 3/4; background: var(--elev); }
.photo-grid img { width: 100%; height: 100%; object-fit: cover; }
.photo-grid figcaption { position: absolute; bottom: 0; left: 0; right: 0; padding: 14px 8px 6px; font-size: 10px; font-weight: 700; background: linear-gradient(transparent, rgba(0,0,0,.75)); }

.statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.stat .lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--dim); margin-bottom: 8px; }
/* Cronómetro de series */
.setrow.chrono { grid-template-columns: 30px 1fr 48px; }
.tbtn { width: 48px; height: 44px; border-radius: 12px; background: var(--violet-dim); color: var(--violet); font-size: 17px; flex-shrink: 0; }
.tbtn.run { background: var(--violet); color: #17103A; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .7; } }

/* Comparador antes/después */
.compare { position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 3/4; background: var(--elev); user-select: none; -webkit-user-select: none; }
.compare img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.compare .top { z-index: 1; clip-path: inset(0 calc(100% - var(--cut, 50%)) 0 0); }
.compare .bar { z-index: 2; position: absolute; top: 0; bottom: 0; left: var(--cut, 50%); width: 2px; background: #fff; box-shadow: 0 0 12px rgba(0,0,0,.7); pointer-events: none; }
.compare .cap { z-index: 2; position: absolute; top: 8px; font-size: 10px; font-weight: 800; letter-spacing: .06em; padding: 3px 8px; border-radius: 6px; background: rgba(0,0,0,.55); pointer-events: none; }
.compare .capA { left: 8px; } .compare .capB { right: 8px; }
input[type=range].scrub { width: 100%; margin-top: 12px; accent-color: var(--mint); }

/* Salida del coach IA */
.ai-out { font-size: 14.5px; line-height: 1.6; }
.ai-out p { margin-bottom: 10px; }
.ai-out strong { color: var(--mint); }
code { background: var(--elev); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; font-size: 11.5px; word-break: break-all; }

/* ==========================================================================
   Bitácora — capa de rediseño (tipografía, bordes, sin emojis ni anillos)
   ========================================================================== */
body { font-size: 14px; line-height: 1.5; }
h1.greet { font-family: var(--display); font-size: 42px; font-weight: 700; line-height: .95; letter-spacing: 0; text-transform: uppercase; }
.sub { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; margin-top: 6px; }
h2 { font-family: var(--font); font-size: 11px; font-weight: 500; letter-spacing: .1em; color: var(--dim); margin: 28px 0 0; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.card { background: transparent; border: 1px solid var(--line); border-radius: 0; }
h2 + .card { border-top: none; }
.eyebrow { font-weight: 500; letter-spacing: .1em; }
.metric .n { font-family: var(--display); font-weight: 600; font-size: 38px; letter-spacing: 0; }
.metric.xl .n { font-size: 56px; }
.metric .u { font-weight: 400; font-size: 11px; }
.item { padding: 12px 0; border-bottom: 1px dashed var(--line); }
.item .ico, .ico { display: none !important; }

/* ==========================================================================
   Storage — adaptador de persistencia
   --------------------------------------------------------------------------
   Interfaz mínima (load/save/exportJSON/importJSON). Si localStorage no está
   disponible (modo incógnito, vista previa embebida), degrada a memoria y lo
   informa. Para migrar a IndexedDB o a una API, se reemplaza solo esta capa.
   ========================================================================== */
const Storage = (() => {
  let memory = null;
  let persistent = true;
  let ns = null; // id de usuario logueado; null = invitado (datos locales del dispositivo)
  try {
    const k = "__vform_test__";
    localStorage.setItem(k, "1");
    localStorage.removeItem(k);
  } catch (_) { persistent = false; }

  const key = () => CONFIG.storageKey + (ns ? ".u." + ns : "");

  return {
    get persistent() { return persistent; },
    setNamespace(userId) { ns = userId || null; memory = null; },
    load() {
      if (!persistent) return memory;
      try { return JSON.parse(localStorage.getItem(key())); }
      catch (_) { return null; }
    },
    save(state) {
      if (!persistent) { memory = state; return; }
      try { localStorage.setItem(key(), JSON.stringify(state)); }
      catch (e) { console.warn("No se pudo guardar:", e); UI.toast("Almacenamiento lleno"); }
    },
    exportJSON(state) {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `vform-respaldo-${Dates.todayKey()}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    },
    importJSON(file, onDone) {
      const r = new FileReader();
      r.onload = () => {
        try {
          const data = JSON.parse(r.result);
          if (!data || typeof data !== "object" || !data.version) throw new Error("formato");
          onDone(data);
        } catch (_) { UI.toast("Archivo no válido"); }
      };
      r.readAsText(file);
    },
  };
})();

/* ==========================================================================
   Conn — configuración del dispositivo (no viaja con los datos de usuario)
   API keys y URL del proyecto viven acá, fuera del estado sincronizable.
   ========================================================================== */
const Conn = (() => {
  const KEY = "vform.conn";
  let data = { geminiKey: "", supabaseUrl: CONFIG.cloud.url, supabaseKey: CONFIG.cloud.key };
  try { data = Object.assign(data, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (_) {}
  if (!data.supabaseUrl) data.supabaseUrl = CONFIG.cloud.url;
  if (!data.supabaseKey) data.supabaseKey = CONFIG.cloud.key;
  return {
    get: () => data,
    set(patch) {
      Object.assign(data, patch);
      try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (_) {}
    },
  };
})();

/* ==========================================================================
   Auth — cuentas con Supabase Auth (email + contraseña)
   Sesión persistida en el dispositivo; refresh automático del token.
   ========================================================================== */
const Auth = (() => {
  const KEY = "vform.session";
  let session = null;
  try { session = JSON.parse(localStorage.getItem(KEY)); } catch (_) {}

  const base = () => Conn.get().supabaseUrl.trim().replace(/\/+$/, "") + "/auth/v1";
  const headers = () => ({ apikey: Conn.get().supabaseKey.trim(), "Content-Type": "application/json" });
  const persist = s => {
    session = s;
    try { s ? localStorage.setItem(KEY, JSON.stringify(s)) : localStorage.removeItem(KEY); } catch (_) {}
  };
  const store = j => persist({
    access_token: j.access_token,
    refresh_token: j.refresh_token,
    expires_at: Date.now() + ((j.expires_in || 3600) - 60) * 1000,
    user: { id: j.user.id, email: j.user.email },
  });

  return {
    get user() { return session?.user || null; },

    async signUp(email, password) {
      const res = await fetch(base() + "/signup", { method: "POST", headers: headers(), body: JSON.stringify({ email, password }) });
      const j = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(j.msg || j.error_description || j.message || ("HTTP " + res.status));
      if (j.access_token) store(j); // si el proyecto no exige confirmación por email
      return j;
    },

    async signIn(email, password) {
      const res = await fetch(base() + "/token?grant_type=password", { method: "POST", headers: headers(), body: JSON.stringify({ email, password }) });
      const j = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(j.error_description || j.msg || j.message || ("HTTP " + res.status));
      store(j);
      return j;
    },

    // Token vigente; si venció, lo renueva con el refresh_token
    async token() {
      if (!session) throw new Error("sin sesión");
      if (Date.now() < session.expires_at) return session.access_token;
      const res = await fetch(base() + "/token?grant_type=refresh_token", { method: "POST", headers: headers(), body: JSON.stringify({ refresh_token: session.refresh_token }) });
      const j = await res.json().catch(() => ({}));
      if (!res.ok) { persist(null); throw new Error("sesión vencida — entrá de nuevo"); }
      store(j);
      return session.access_token;
    },

    // Cambiar la contraseña de la cuenta logueada (PUT /auth/v1/user)
    async changePassword(password) {
      const t = await this.token();
      const res = await fetch(base() + "/user", { method: "PUT", headers: { ...headers(), Authorization: "Bearer " + t }, body: JSON.stringify({ password }) });
      const j = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(j.msg || j.error_description || j.message || ("HTTP " + res.status));
    },

    // Mail con link para elegir una contraseña nueva
    async recover(email) {
      const back = encodeURIComponent(location.origin + location.pathname);
      const res = await fetch(base() + "/recover?redirect_to=" + back, { method: "POST", headers: headers(), body: JSON.stringify({ email }) });
      const j = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(j.msg || j.error_description || j.message || ("HTTP " + res.status));
    },

    // Al volver del link del mail (…#access_token=…&type=recovery) abre la sesión
    async adoptRecovery(hash) {
      const q = new URLSearchParams(hash.replace(/^#/, ""));
      if (q.get("type") !== "recovery" || !q.get("access_token")) return false;
      const at = q.get("access_token");
      const res = await fetch(base() + "/user", { headers: { ...headers(), Authorization: "Bearer " + at } });
      const u = await res.json().catch(() => ({}));
      if (!res.ok || !u.id) throw new Error("El link venció. Pedí otro.");
      persist({ access_token: at, refresh_token: q.get("refresh_token") || "", expires_at: Date.now() + (parseInt(q.get("expires_in") || "3600", 10) - 60) * 1000, user: { id: u.id, email: u.email } });
      return true;
    },

    signOut() { persist(null); },
  };
})();

// Si hay sesión guardada, el Store nace ya en el espacio de ese usuario
if (Auth.user) Storage.setNamespace(Auth.user.id);


/* ==========================================================================
   Store — estado + suscripciones
   ========================================================================== */
const Store = (() => {
  const blank = () => ({
    version: CONFIG.version,
    createdAt: new Date().toISOString(),
    profile: { ...CONFIG.goal },
    weights: [],        // [{date:"YYYY-MM-DD", kg:Number}]
    measurements: [],   // [{date, cintura, pecho, hombros, brazos, piernas}]
    photos: [],         // [{date, dataUrl, note}]
    workouts: [],       // [{id, date, exercises:{exId:{sets:[{reps|secs, obs}]}}, note}]
    meals: {},          // {"YYYY-MM-DD": {desayuno:[ids], comida:[ids], cena:[ids]}}
    habits: {},         // {"YYYY-MM-DD": {habitId:true}}
    dailyDone: {},      // {"YYYY-MM-DD": {caminata:true, movilidad:true, elongacion:true}}
    coachSeen: {},      // {"YYYY-MM-DD": msgIndex} para no repetir mensajes
    settings: { geminiKey: "", supabaseUrl: "", supabaseKey: "" },
    aiCache: {},        // {"YYYY-MM-DD": análisis del coach IA}
  });

  let state = Storage.load() || blank();
  const ensure = st => {
    st.settings = Object.assign({ geminiKey: "", supabaseUrl: "", supabaseKey: "" }, st.settings || {});
    st.aiCache = st.aiCache || {};
    st.workouts = st.workouts || []; st.weights = st.weights || []; st.measurements = st.measurements || []; st.photos = st.photos || [];
    // Los defaults viejos (80 → 75) no eran los tuyos: si nunca se tocaron, pasan a 98 → 92
    if (st.profile && st.profile.startWeight === 80 && st.profile.targetWeight === 75) {
      st.profile.startWeight = CONFIG.goal.startWeight;
      st.profile.targetWeight = CONFIG.goal.targetWeight;
    }
    st.updatedAt = st.updatedAt || new Date().toISOString();
    return st;
  };
  state = ensure(state);
  // Migrar claves guardadas en versiones anteriores (vivían en el estado) a Conn
  {
    const s = state.settings, c = Conn.get();
    if ((s.geminiKey || s.supabaseUrl || s.supabaseKey) && !c.geminiKey && !c.supabaseUrl && !c.supabaseKey) {
      Conn.set({ geminiKey: s.geminiKey || "", supabaseUrl: s.supabaseUrl || "", supabaseKey: s.supabaseKey || "" });
    }
  }
  // Migraciones futuras: if (state.version < 2) { ...; state.version = 2; }

  const subs = new Set();

  return {
    get s() { return state; },
    commit() { state.updatedAt = new Date().toISOString(); Storage.save(state); subs.forEach(fn => fn(state)); },
    replace(next) {
      // Un respaldo viejo sin `config` no debe borrar el plan del usuario
      if (next && !next.config && state.config) next.config = state.config;
      // Un respaldo que ya no trae entrenos/peso/medidas (viven en tablas) no debe vaciarlos acá
      if (next && next.recordsInDb) { next.workouts = state.workouts; next.weights = state.weights; next.measurements = state.measurements; }
      state = ensure(next); this.commit();
    },
    // Recarga desde el namespace activo (cambio de usuario) sin pisar updatedAt
    reload() { state = ensure(Storage.load() || blank()); subs.forEach(fn => fn(state)); },
    reset() { const c = state.config; state = blank(); if (c) state.config = c; this.commit(); },
    subscribe(fn) { subs.add(fn); return () => subs.delete(fn); },
  };
})();

/* ---- Cfg: configuración por usuario (plan, ejercicios, objetivo, hábitos).
   Si el estado del usuario trae `config`, manda; si no, valen los defaults de CONFIG. ---- */
// Config que el coach guarda en el servidor para cada cuenta (tabla user_config, solo lectura).
// Se cachea en el dispositivo para que funcione sin conexión.
const CfgStore = {
  data: null,
  key: uid => "vform.cfg." + uid,
  load(uid) { try { this.data = JSON.parse(localStorage.getItem(this.key(uid))); } catch (_) { this.data = null; } },
  set(c, uid) { this.data = c; try { c ? localStorage.setItem(this.key(uid), JSON.stringify(c)) : localStorage.removeItem(this.key(uid)); } catch (_) {} },
  clear() { this.data = null; },
};
const Cfg = new Proxy({}, {
  get(_, k) {
    const o = CfgStore.data || (typeof Store !== "undefined" && Store.s && Store.s.config) || null;
    if (k === "pullups") return (Cfg.goal.pullupTarget || 0) > 0;
    if (k === "hasCoke") return Cfg.habits.some(h => h.id === "coca");
    if (k === "goal") return { ...CONFIG.goal, ...((o && o.goal) || {}) };
    return (o && o[k] != null) ? o[k] : CONFIG[k];
  },
});

/* ==========================================================================
   Services — lógica de negocio pura
   ========================================================================== */

/* ---- Fechas ---- */
const Dates = {
  key(d) {
    const x = d instanceof Date ? d : new Date(d + "T12:00:00");
    return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
  },
  todayKey() { return this.key(new Date()); },
  addDays(key, n) { const d = new Date(key + "T12:00:00"); d.setDate(d.getDate()+n); return this.key(d); },
  daysBetween(a, b) { return Math.round((new Date(b+"T12:00:00") - new Date(a+"T12:00:00")) / 864e5); },
  weekday(key) { return new Date(key + "T12:00:00").getDay(); },
  fmt(key, opts) {
    return new Date(key + "T12:00:00").toLocaleDateString("es", opts || { day: "numeric", month: "short" });
  },
  fmtLong(key) { return this.fmt(key, { weekday: "long", day: "numeric", month: "long" }); },
  isTrainingDay(key) { return !!Plan.sessionFor(key); },
  nextTrainingDay(fromKey) {
    let k = fromKey;
    for (let i = 0; i < 8; i++) { if (this.isTrainingDay(k)) return k; k = this.addDays(k, 1); }
    return fromKey;
  },
};

/* ---- Ejercicios (plan actual + historial legacy) ---- */
const Ex = {
  all() { return [...Cfg.exercises, ...Cfg.legacyExercises]; },
  get(id) { return this.all().find(e => e.id === id) || null; },
  setText(ex, sets) {
    return sets.map(s => ex.type === "kgreps" ? `${s.kg ?? 0}×${s.v}` : ex.type === "secs" ? `${s.v}s` : `${s.v}`).join(" · ");
  },
};

/* ---- Plan por fases ---- */
const Plan = {
  start() { return Store.s.profile.returnDate || null; },
  started() { return !!this.start(); },
  setStart(key) { Store.s.profile.returnDate = key || null; Store.commit(); },
  phaseId(key = Dates.todayKey()) {
    const s = this.start();
    if (!s) return 1;
    const d = Dates.daysBetween(s, key);
    return d < 14 ? 1 : d < 28 ? 2 : 3;
  },
  phase(key) { return Cfg.plan.phases.find(p => p.id === this.phaseId(key)); },
  // Días elegidos en Ajustes: las sesiones de la fase se reparten en orden sobre esos días
  daysMap(ph) {
    const custom = Store.s.profile.trainDays;
    if (!Array.isArray(custom) || !custom.length) return ph.days;
    const order = k => (k + 6) % 7;
    const sessions = Object.keys(ph.days).map(Number).sort((a, b) => order(a) - order(b)).map(k => ph.days[k]);
    const days = custom.map(Number).sort((a, b) => order(a) - order(b));
    const m = {};
    days.forEach((d, i) => { if (sessions[i]) m[d] = sessions[i]; });
    return m;
  },
  sessionFor(key) {
    const ph = this.phase(key);
    const sid = this.daysMap(ph)[Dates.weekday(key)];
    if (!sid) return null;
    const s = Cfg.plan.sessions[sid];
    return { id: sid, name: s.name, sub: s.sub, ex: (ph.id === 1 && s.exP1) ? s.exP1 : s.ex, phase: ph };
  },
  sessionById(id, key) {
    const s = Cfg.plan.sessions[id]; if (!s) return null;
    const ph = this.phase(key);
    return { id, name: s.name, sub: s.sub, ex: (ph.id === 1 && s.exP1) ? s.exP1 : s.ex, phase: ph };
  },
  // Sesión que mejor coincide con lo registrado en un entreno
  inferSession(w, key) {
    const logged = Object.keys(w?.exercises || {});
    let best = 0, id = null;
    Object.entries(Cfg.plan.sessions).forEach(([sid, x]) => {
      const n = logged.filter(e => x.ex.includes(e)).length;
      if (n > best) { best = n; id = sid; }
    });
    return id ? this.sessionById(id, key) : null;
  },
  isCardio(key) { const ph = this.phase(key); return !!(ph.cardio && ph.cardio.includes(Dates.weekday(key))); },
  setsFor(ex, key) { const ph = this.phase(key); return ph.setsCap ? Math.min(ph.setsCap, ex.sets) : ex.sets; },
  suggestKg(ex, key) {
    if (ex.ref == null) return null;
    const f = ex.noScale ? 1 : this.phase(key).factor;
    const st = ex.step || 1;
    return +(Math.round(ex.ref * f / st) * st).toFixed(2);
  },
  weekLabel() {
    const ph = this.phase();
    const n = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
    const order = k => (k + 6) % 7;
    const days = Object.keys(this.daysMap(ph)).map(Number).sort((a, b) => order(a) - order(b)).map(k => n[k]).join(" · ");
    return days + (ph.cardio ? " · caminata " + ph.cardio.map(k => n[k]).join(", ") : "");
  },
  progressText() {
    const s = this.start();
    if (!s) return "";
    const d = Math.max(0, Dates.daysBetween(s, Dates.todayKey()));
    return `Semana ${Math.floor(d / 7) + 1} desde el ${Dates.fmt(s)}`;
  },
};

/* ---- Progreso de peso y objetivo ---- */
const Progress = {
  latestWeight() {
    const w = [...Store.s.weights].sort((a,b) => a.date < b.date ? -1 : 1);
    return w.length ? w[w.length-1] : null;
  },
  firstWeight() {
    const w = [...Store.s.weights].sort((a,b) => a.date < b.date ? -1 : 1);
    return w.length ? w[0] : { kg: Store.s.profile.startWeight, date: null };
  },
  currentKg() {
    const l = this.latestWeight();
    return l ? l.kg : Store.s.profile.startWeight;
  },
  lostKg() {
    return Math.max(0, this.firstWeight().kg - this.currentKg());
  },
  weightPct() {
    const p = Store.s.profile;
    const total = p.startWeight - p.targetWeight;
    if (total <= 0) return 0;
    return Math.min(100, Math.max(0, ((p.startWeight - this.currentKg()) / total) * 100));
  },
  // % global del objetivo: mitad peso, mitad camino a la dominada
  goalPct() {
    return Cfg.pullups ? Math.round(this.weightPct() * 0.5 + Pullup.pct() * 0.5) : Math.round(this.weightPct());
  },
  // Índice de masa corporal (OMS). Necesita la altura del perfil.
  bmi(kg) { const h = Store.s.profile.heightCm; return h > 0 && kg > 0 ? kg / Math.pow(h / 100, 2) : null; },
  bmiLabel(v) { return v < 18.5 ? "Bajo peso" : v < 25 ? "Peso normal" : v < 30 ? "Sobrepeso" : "Obesidad"; },
  bmiRange() { const h = Store.s.profile.heightCm; if (!(h > 0)) return null; const m2 = Math.pow(h / 100, 2); return [18.5 * m2, 24.9 * m2]; },
  weekTrend() {
    const w = [...Store.s.weights].sort((a,b) => a.date < b.date ? -1 : 1);
    if (w.length < 2) return null;
    const last = w[w.length-1];
    const weekAgo = Dates.addDays(last.date, -7);
    const prev = [...w].reverse().find(x => x.date <= weekAgo) || w[0];
    if (prev.date === last.date) return null;
    return +(last.kg - prev.kg).toFixed(1);
  },
};

/* ---- Entrenamiento ---- */
const Workouts = {
  byDate(key) { return Store.s.workouts.find(w => w.date === key) || null; },
  sorted() { return [...Store.s.workouts].sort((a,b) => a.date < b.date ? -1 : 1); },
  previousBefore(key) {
    return this.sorted().filter(w => w.date < key).pop() || null;
  },
  // Volumen por ejercicio en una sesión: suma de reps o de segundos
  volume(workout, exId) {
    const ex = workout?.exercises?.[exId];
    if (!ex || !ex.sets?.length) return 0;
    return ex.sets.reduce((s, set) => s + (Number(set.v) || 0), 0);
  },
  bestSet(workout, exId) {
    const ex = workout?.exercises?.[exId];
    if (!ex || !ex.sets?.length) return 0;
    return Math.max(...ex.sets.map(s => Number(s.v) || 0));
  },
  totalSets(workout) {
    return Object.values(workout.exercises || {}).reduce((s, e) => s + (e.sets?.length || 0), 0);
  },
  // Métrica de progreso por ejercicio: tonelaje (kg×reps) si hay carga; si no, repeticiones/segundos
  metric(workout, ex) {
    const e = workout?.exercises?.[ex.id];
    if (!e || !e.sets?.length) return 0;
    if (ex.type === "kgreps" && !ex.assist)
      return e.sets.reduce((s, x) => s + (Number(x.kg) || 0) * (Number(x.v) || 0), 0);
    return e.sets.reduce((s, x) => s + (Number(x.v) || 0), 0);
  },
  // Series de la última sesión anterior a `key` que incluya el ejercicio
  lastSets(exId, key) {
    const w = this.sorted().filter(x => x.date < key && x.exercises?.[exId]?.sets?.length).pop();
    return w ? w.exercises[exId].sets : [];
  },
  describe(workout) {
    return Ex.all().map(ex => {
      const sets = workout.exercises?.[ex.id]?.sets;
      return sets?.length ? `${ex.name} ${Ex.setText(ex, sets)}${ex.type === "kgreps" ? ` (${ex.unit})` : ""}` : null;
    }).filter(Boolean).join(", ");
  },
  // Comparación contra la sesión anterior → [{ex, now, before, delta}]
  compare(workout) {
    const prev = this.previousBefore(workout.date);
    if (!prev) return null;
    return Ex.all().map(ex => {
      const now = this.metric(workout, ex);
      const before = this.metric(prev, ex);
      if (!now && !before) return null;
      return { ex, now, before, delta: now - before };
    }).filter(Boolean);
  },
  trainingStreak() {
    // Racha: sesiones consecutivas sin fallar ningún día programado (L-M-V).
    // Toda sesión suma (aunque sea un día extra); la racha se corta solo
    // cuando un día de entrenamiento pasó sin sesión.
    let streak = 0;
    let k = Dates.todayKey();
    if (!this.byDate(k)) k = Dates.addDays(k, -1); // hoy todavía puede entrenar
    for (let i = 0; i < 366; i++) {
      if (this.byDate(k)) streak++;
      else if (Dates.isTrainingDay(k)) break;
      k = Dates.addDays(k, -1);
    }
    return streak;
  },
  daysTrained() { return Store.s.workouts.length; },
};

/* ---- Dominadas: progreso, etapa y predicción ---- */
const Pullup = {
  // Serie histórica del mejor colgado por sesión
  hangHistory() {
    return Workouts.sorted()
      .map(w => ({ date: w.date, secs: Workouts.bestSet(w, "colgado") }))
      .filter(h => h.secs > 0);
  },
  bestHang() {
    const h = this.hangHistory();
    return h.length ? Math.max(...h.map(x => x.secs)) : 0;
  },
  latestHang() {
    const h = this.hangHistory();
    return h.length ? h[h.length-1].secs : 0;
  },
  // Dominadas con el plan de gimnasio: reps estrictas y asistencia
  repsHistory() {
    // Una serie asistida con 0 kg de asistencia es una dominada estricta
    const strictAsAssist = w => Math.max(0, ...(w.exercises?.["dominada-asist"]?.sets || []).filter(s => !(Number(s.kg) > 0)).map(s => Number(s.v) || 0));
    return Workouts.sorted().map(w => ({ date: w.date, reps: Math.max(Workouts.bestSet(w, "dominada") || 0, strictAsAssist(w)) })).filter(h => h.reps > 0);
  },
  bestReps() {
    return Math.max(Cfg.baseline.pullupReps, ...this.repsHistory().map(h => h.reps));
  },
  assistHistory() {
    return Workouts.sorted().map(w => {
      const sets = (w.exercises?.["dominada-asist"]?.sets || []).filter(s => s.v > 0 && Number(s.kg) > 0);
      return { date: w.date, kg: sets.length ? Math.min(...sets.map(s => Number(s.kg) || 0)) : null };
    }).filter(h => h.kg !== null);
  },
  bestAssist() {
    return Math.min(Cfg.baseline.assistKg, ...this.assistHistory().map(h => h.kg));
  },
  pct() {
    return Math.min(100, (this.bestReps() / Cfg.goal.pullupTarget) * 100);
  },
  stage() {
    const best = this.bestHang();
    let idx = 0;
    Cfg.pullupStages.forEach((s, i) => { if (best >= s.min) idx = i; });
    return { idx, ...Cfg.pullupStages[idx] };
  },
  // Regresión lineal sobre los últimos colgados → fecha estimada de 90 s
  prediction() {
    const h = this.hangHistory().slice(-10);
    if (h.length < 3) return { ready: false, need: 3 - h.length };
    const t0 = new Date(h[0].date + "T12:00:00").getTime();
    const pts = h.map(x => ({ x: (new Date(x.date+"T12:00:00").getTime() - t0) / 864e5, y: x.secs }));
    const n = pts.length;
    const sx = pts.reduce((s,p)=>s+p.x,0), sy = pts.reduce((s,p)=>s+p.y,0);
    const sxy = pts.reduce((s,p)=>s+p.x*p.y,0), sxx = pts.reduce((s,p)=>s+p.x*p.x,0);
    const denom = n*sxx - sx*sx;
    if (!denom) return { ready: false, flat: true };
    const slope = (n*sxy - sx*sy) / denom;           // segundos ganados por día
    const intercept = (sy - slope*sx) / n;
    if (slope <= 0.05) return { ready: true, slope, stalled: true };
    const target = Cfg.goal.hangTargetSecs;
    const daysToTarget = (target - intercept) / slope;
    const dateKey = Dates.addDays(Dates.key(new Date(t0)), Math.ceil(daysToTarget));
    const daysLeft = Math.max(0, Dates.daysBetween(Dates.todayKey(), dateKey));
    return { ready: true, slope, dateKey, daysLeft, stalled: false };
  },
  shouldProgress() {
    // Aviso de subir dificultad: 3 sesiones seguidas superando el umbral de la etapa siguiente
    const stages = Cfg.pullupStages;
    const st = this.stage();
    if (st.idx >= stages.length - 1) return null;
    const nextMin = stages[st.idx + 1].min;
    const recent = this.hangHistory().slice(-3);
    if (recent.length === 3 && recent.every(h => h.secs >= nextMin)) {
      return stages[st.idx + 1];
    }
    return null;
  },
};

/* ---- Hábitos y rachas ---- */
const Habits = {
  get(dateKey) { return Store.s.habits[dateKey] || {}; },
  toggle(dateKey, id) {
    const day = { ...(Store.s.habits[dateKey] || {}) };
    day[id] = !day[id];
    if (!day[id]) delete day[id];
    Store.s.habits[dateKey] = day;
    Store.commit();
  },
  // Racha de un hábito. good: días seguidos marcado. avoid: días seguidos SIN marcar
  streak(id) {
    const def = Cfg.habits.find(h => h.id === id);
    if (!def) return 0;
    const first = this.firstLogDate();
    if (!first) return 0;
    let streak = 0;
    let k = Dates.todayKey();
    const todayVal = !!this.get(k)[id];
    if (def.kind === "good" && !todayVal) k = Dates.addDays(k, -1); // hoy todavía puede cumplir
    for (let i = 0; i < 730; i++) {
      if (k < first) break;
      const v = !!this.get(k)[id];
      const ok = def.kind === "good" ? v : !v;
      if (ok) streak++; else break;
      k = Dates.addDays(k, -1);
    }
    return streak;
  },
  firstLogDate() {
    const keys = Object.keys(Store.s.habits).sort();
    const wDates = Store.s.workouts.map(w => w.date).sort();
    const cands = [keys[0], wDates[0]].filter(Boolean).sort();
    return cands[0] || null;
  },
  daysWithoutCoke() { return this.streak("coca"); },
};

/* ---- Estadísticas globales ---- */
const Stats = {
  totalSets() { return Store.s.workouts.reduce((s,w) => s + Workouts.totalSets(w), 0); },
  totalReps() {
    return Store.s.workouts.reduce((s,w) =>
      s + Ex.all().filter(e => e.type !== "secs")
            .reduce((a,e) => a + Workouts.volume(w, e.id), 0), 0);
  },
  totalHangSecs() {
    return Store.s.workouts.reduce((s,w) => s + Workouts.volume(w, "colgado"), 0);
  },
  weeklyWorkoutCounts(nWeeks = 8) {
    // [{label, count}] de las últimas nWeeks semanas
    const out = [];
    let end = Dates.todayKey();
    for (let i = 0; i < nWeeks; i++) {
      const start = Dates.addDays(end, -6);
      const count = Store.s.workouts.filter(w => w.date >= start && w.date <= end).length;
      out.unshift({ label: Dates.fmt(start), count });
      end = Dates.addDays(start, -1);
    }
    return out;
  },
};

/* ---- Coach: mensajes según progreso real, sin repetición ---- */
const Coach = {
  pool() {
    const kg = Progress.lostKg().toFixed(1);
    const cur = Progress.currentKg().toFixed(1);
    const left = Math.max(0, Progress.currentKg() - Store.s.profile.targetWeight).toFixed(1);
    const reps = Pullup.bestReps();
    const streak = Workouts.trainingStreak();
    const coke = Habits.daysWithoutCoke();
    const daysToDec = Math.max(0, Dates.daysBetween(Dates.todayKey(), Store.s.profile.targetDateISO));
    const pred = Pullup.prediction();
    const stage = Pullup.stage();
    const trend = Progress.weekTrend();

    const msgs = [];
    // Basados en datos concretos: solo entran si el dato existe
    if (kg > 0) msgs.push(`Ya dejaste atrás <em>${kg} kg</em>. Faltan ${left}. El cuerpo que buscás se construye exactamente así: sesión a sesión.`);
    if (Cfg.pullups && reps > 0) msgs.push(`Tu mejor serie de dominadas estrictas es de <em>${reps}</em>. Cada repetición nueva es espalda ancha que se nota.`);
    if (Cfg.pullups && reps < Cfg.goal.pullupTarget) msgs.push(`Te faltan <em>${Cfg.goal.pullupTarget - reps}</em> para tu objetivo de dominadas. Son repeticiones, no meses.`);
    if (streak >= 2) msgs.push(`Llevás <em>${streak} entrenamientos seguidos</em> sin fallar. La constancia es el único suplemento que funciona siempre.`);
    if (streak >= 5) msgs.push(`Racha de <em>${streak}</em>. Esto ya no es motivación: es identidad. Sos alguien que entrena.`);
    if (Cfg.hasCoke && coke >= 3) msgs.push(`<em>${coke} días sin Coca-Cola</em>. Esa constancia silenciosa vale tanto como cualquier serie.`);
    if (Cfg.hasCoke && coke >= 14) msgs.push(`Dos semanas o más sin Coca-Cola. Tu cintura lo va a notar antes que vos.`);
    if (trend !== null && trend < 0) msgs.push(`Esta semana: <em>${trend} kg</em>. Vas en la dirección correcta. Mantené el plan, no lo cambies porque funciona.`);
    if (trend !== null && trend >= 0 && kg > 0) msgs.push(`La balanza se movió poco esta semana. Normal: el progreso no es lineal. Se juzga por meses, no por días.`);
    if (daysToDec > 0) msgs.push(`Quedan <em>${daysToDec} días</em> hasta diciembre. Es tiempo de sobra si cada semana cumplís las sesiones del plan.`);
    if (cur > 0 && kg > 0) msgs.push(`Hoy pesás <em>${cur} kg</em>. El número importa menos que la tendencia, y la tendencia la escribís vos.`);

    // Fondo general para días sin datos suficientes
    msgs.push(`El plan es simple: entrenar, sumar de a poco, caminar, comer bien. Lo difícil es hacerlo un día cualquiera. Hoy es uno de esos días.`);
    if (Cfg.pullups) {
      msgs.push(`Nadie ve las series que hacés hoy. Todos van a ver la espalda que tenés en diciembre.`);
      msgs.push(`La dominada no se consigue el día que sale: se consigue todos los días anteriores.`);
    } else {
      msgs.push(`Nadie ve las series que hacés hoy. Todos van a notar cómo te sentís en diciembre.`);
      msgs.push(`Un día flojo no arruina nada. Lo que cuenta es volver a la próxima sesión.`);
    }
    msgs.push(`Entrená como si ya fueras la persona que querés ser en diciembre. El cuerpo alcanza a la conducta.`);
    return msgs;
  },
  today() {
    const key = Dates.todayKey();
    const pool = this.pool();
    const seen = Store.s.coachSeen || {};
    if (seen[key] !== undefined && pool[seen[key]]) return pool[seen[key]];
    // Elegir evitando lo mostrado los últimos 7 días
    const recent = Object.entries(seen)
      .filter(([d]) => Dates.daysBetween(d, key) <= 7)
      .map(([,i]) => i);
    const candidates = pool.map((_,i) => i).filter(i => !recent.includes(i));
    const list = candidates.length ? candidates : pool.map((_,i)=>i);
    // Determinista por fecha para que no cambie al recargar
    const seed = key.split("-").reduce((s,x)=>s + Number(x), 0);
    const idx = list[seed % list.length];
    seen[key] = idx;
    Store.s.coachSeen = seen;
    Store.commit();
    return pool[idx];
  },
};

    const res = await fetch(

  },
};

/* ---- Insights: cruces entre hábitos y rendimiento real ---- */
const Insights = {
  _avg(arr) { return arr.reduce((s, x) => s + x, 0) / arr.length; },

  list() {
    const out = [];
    const ws = Workouts.sorted();

    // 1) Dormir bien (noche anterior) → colgado
    {
      const conSueno = [], sinSueno = [];
      ws.forEach(w => {
        const secs = Workouts.bestSet(w, "colgado");
        if (!secs) return;
        (Habits.get(Dates.addDays(w.date, -1))["sueno"] ? conSueno : sinSueno).push(secs);
      });
      if (conSueno.length >= 3 && sinSueno.length >= 3) {
        const d = (this._avg(conSueno) - this._avg(sinSueno)) / this._avg(sinSueno) * 100;
        if (Math.abs(d) >= 8) out.push({
          color: "var(--violet)",
          text: `Cuando dormís bien la noche anterior, tu colgado promedia <em>${d > 0 ? "+" : ""}${d.toFixed(0)}%</em> (${this._avg(conSueno).toFixed(0)}s vs ${this._avg(sinSueno).toFixed(0)}s). El sueño es parte del entrenamiento.`,
        });
      }
    }

    // 2) Creatina (mismo día) → volumen de repeticiones de la sesión
    {
      const con = [], sin = [];
      ws.forEach(w => {
        const vol = Ex.all().filter(e => e.type !== "secs")
          .reduce((s, e) => s + Workouts.volume(w, e.id), 0);
        if (!vol) return;
        (Habits.get(w.date)["creatina"] ? con : sin).push(vol);
      });
      if (con.length >= 3 && sin.length >= 3) {
        const d = (this._avg(con) - this._avg(sin)) / this._avg(sin) * 100;
        if (Math.abs(d) >= 8) out.push({
          color: "var(--mint)",
          text: `Los días con creatina movés <em>${d > 0 ? "+" : ""}${d.toFixed(0)}%</em> de volumen total (${this._avg(con).toFixed(0)} vs ${this._avg(sin).toFixed(0)} reps por sesión).`,
        });
      }
    }

    // 3) Coca-Cola entre pesajes → ritmo de descenso
    {
      const wt = [...Store.s.weights].sort((a, b) => a.date < b.date ? -1 : 1);
      const conCoca = [], sinCoca = [];
      for (let i = 1; i < wt.length; i++) {
        const days = Dates.daysBetween(wt[i-1].date, wt[i].date);
        if (days < 1 || days > 21) continue;
        const rate = (wt[i].kg - wt[i-1].kg) / days * 1000; // g/día
        let coca = false;
        for (let d = 1; d <= days; d++) if (Habits.get(Dates.addDays(wt[i-1].date, d))["coca"]) { coca = true; break; }
        (coca ? conCoca : sinCoca).push(rate);
      }
      if (conCoca.length >= 3 && sinCoca.length >= 3) {
        const a = this._avg(sinCoca), b = this._avg(conCoca);
        if (a < b - 10) out.push({
          color: "var(--coral)",
          text: `En los tramos <em>sin Coca-Cola</em> tu peso se mueve a ${a.toFixed(0)} g/día; con Coca de por medio, ${b.toFixed(0)} g/día. Los datos son tuyos, la conclusión también.`,
        });
      }
    }

    return out;
  },
};

/* ---- Sync opcional con Supabase (respaldo en la nube, multi-dispositivo) ---- */
const Sync = {
  configured() {
    const c = Conn.get();
    return !!(c.supabaseUrl || "").trim() && !!(c.supabaseKey || "").trim();
  },
  // Con sesión, el token del usuario va en Authorization → RLS aplica sola
  async _headers() {
    const k = Conn.get().supabaseKey.trim();
    const t = await Auth.token();
    return { apikey: k, Authorization: "Bearer " + t, "Content-Type": "application/json" };
  },
  _url() { return Conn.get().supabaseUrl.trim().replace(/\/+$/, "") + "/rest/v1/vform_state"; },

  async push() {
    if (!Auth.user) throw new Error("iniciá sesión para sincronizar");
    let inDb = true;
    try { await Records.sync(); } catch (e) { inDb = false; console.warn("Records.sync:", e); }
    const res = await fetch(this._url() + "?on_conflict=user_id", {
      method: "POST",
      headers: { ...(await this._headers()), Prefer: "resolution=merge-duplicates" },
      body: JSON.stringify([{ user_id: Auth.user.id, data: inDb ? Records.stripped(Store.s) : Store.s, updated_at: new Date().toISOString() }]),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
  },

  async pull() {
    if (!Auth.user) throw new Error("iniciá sesión para sincronizar");
    const res = await fetch(this._url() + `?user_id=eq.${Auth.user.id}&select=data,updated_at`, { headers: await this._headers() });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const rows = await res.json();
    if (!rows.length) throw new Error("no hay respaldo en la nube todavía");
    return rows[0];
  },

  // Plan y objetivo de esta cuenta (lo escribe el coach; la app solo lee). Devuelve true si cambió.
  async loadConfig() {
    if (!Auth.user) return false;
    const url = Conn.get().supabaseUrl.trim().replace(/\/+$/, "") + "/rest/v1/user_config?select=config&limit=1";
    const res = await fetch(url, { headers: await this._headers() });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const c = ((await res.json())[0] || {}).config || null;
    const changed = JSON.stringify(c) !== JSON.stringify(CfgStore.data);
    CfgStore.set(c, Auth.user.id);
    return changed;
  },

  // Última nota del coach (la escribe la tarea semanal; la app solo la lee)
  async latestNote() {
    if (!Auth.user) return null;
    const url = Conn.get().supabaseUrl.trim().replace(/\/+$/, "") + "/rest/v1/coach_notes?select=week_start,content,created_at&order=created_at.desc&limit=1";
    const res = await fetch(url, { headers: await this._headers() });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return (await res.json())[0] || null;
  },
};

/* ---- Fotos de progreso: Storage privado + tabla progress_photos (RLS por usuario) ---- */
const Photos = {
  items: null,   // [{id, date, path, url}] ordenadas de más nueva a más vieja
  _root() { return Conn.get().supabaseUrl.trim().replace(/\/+$/, ""); },
  async _h(extra) { return { ...(await Sync._headers()), ...(extra || {}) }; },
  // DELETE no lleva cuerpo: con Content-Type JSON, Storage responde 400
  async _hd() { const h = await Sync._headers(); delete h["Content-Type"]; return h; },

  async load() {
    if (!Auth.user) { this.items = []; return this.items; }
    const res = await fetch(this._root() + "/rest/v1/progress_photos?select=id,taken_on,path,pose&order=taken_on.desc,created_at.desc", { headers: await this._h() });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const rows = await res.json();
    let urls = {};
    if (rows.length) {
      const sres = await fetch(this._root() + "/storage/v1/object/sign/progress-photos", {
        method: "POST", headers: await this._h(), body: JSON.stringify({ expiresIn: 3600, paths: rows.map(r => r.path) }),
      });
      if (!sres.ok) throw new Error("HTTP " + sres.status);
      (await sres.json()).forEach(o => { if (o.signedURL) urls[o.path] = this._root() + "/storage/v1" + o.signedURL; });
    }
    this.items = rows.map(r => ({ id: r.id, date: r.taken_on, path: r.path, pose: r.pose || "frente", url: urls[r.path] || "" }));
    return this.items;
  },

  async upload(blob, date, pose = "frente") {
    const path = `${Auth.user.id}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.jpg`;
    const up = await fetch(`${this._root()}/storage/v1/object/progress-photos/${path}`, {
      method: "POST", headers: await this._h({ "Content-Type": "image/jpeg" }), body: blob,
    });
    if (!up.ok) throw new Error("no se pudo subir (HTTP " + up.status + ")");
    const ins = await fetch(this._root() + "/rest/v1/progress_photos", {
      method: "POST", headers: await this._h(), body: JSON.stringify([{ taken_on: date, path, pose }]),
    });
    if (!ins.ok) {
      await fetch(`${this._root()}/storage/v1/object/progress-photos/${path}`, { method: "DELETE", headers: await this._hd() }).catch(() => {});
      throw new Error("no se pudo registrar (HTTP " + ins.status + ")");
    }
  },

  async remove(item) {
    const r1 = await fetch(`${this._root()}/storage/v1/object/progress-photos/${item.path}`, { method: "DELETE", headers: await this._hd() });
    if (!r1.ok) throw new Error("HTTP " + r1.status);
    const r2 = await fetch(this._root() + "/rest/v1/progress_photos?id=eq." + item.id, { method: "DELETE", headers: await this._hd() });
    if (!r2.ok) throw new Error("HTTP " + r2.status);
  },

  // Fotos viejas que vivían dentro del estado (base64) → a Storage, y se sacan del estado
  async migrateLegacy() {
    const legacy = (Store.s.photos || []).filter(p => p.dataUrl);
    if (!legacy.length || !Auth.user) return 0;
    let done = 0;
    for (const p of legacy) {
      const blob = await (await fetch(p.dataUrl)).blob();
      await this.upload(blob, p.date);
      done++;
    }
    Store.s.photos = [];
    Store.commit();
    return done;
  },

  _compress(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const MAX = 1280;
        const k = Math.min(1, MAX / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        cv.toBlob(b => b ? resolve(b) : reject(new Error("imagen inválida")), "image/jpeg", 0.8);
      };
      img.onerror = () => reject(new Error("imagen inválida"));
      img.src = URL.createObjectURL(file);
    });
  },
};
