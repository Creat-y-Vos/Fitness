/* ==========================================================================
   Sheets — modales de captura de datos
   ========================================================================== */
const Sheets = {
  logWeight() {
    const cur = Progress.currentKg();
    UI.openSheet(`
      <h3>Registrar peso</h3>
      <div class="field">
        <label>Peso de hoy (kg)</label>
        <input type="number" inputmode="decimal" step="0.1" id="wkg" value="${cur.toFixed(1)}">
      </div>
      <button class="btn mint" id="wsave">Guardar</button>`,
      sheet => {
        const input = sheet.querySelector("#wkg");
        input.focus(); input.select();
        sheet.querySelector("#wsave").onclick = () => {
          const kg = parseFloat(input.value);
          if (!kg || kg < 30 || kg > 250) return UI.toast("Ingresá un peso válido");
          const today = Dates.todayKey();
          Store.s.weights = Store.s.weights.filter(w => w.date !== today);
          Store.s.weights.push({ date: today, kg: +kg.toFixed(1) });
          Store.commit(); UI.closeSheet(); Router.render();
          UI.toast(kg <= Store.s.profile.targetWeight ? "🎯 ¡Objetivo alcanzado!" : "Peso registrado ⚖️");
        };
      });
  },

  logMeasures() {
    const last = [...Store.s.measurements].sort((a,b)=>a.date<b.date?-1:1).pop() || {};
    UI.openSheet(`
      <h3>Medidas de hoy (cm)</h3>
      ${CONFIG.measures.map(m => `
        <div class="field">
          <label>${m.name}</label>
          <input type="number" inputmode="decimal" step="0.5" data-mid="${m.id}" value="${last[m.id] ?? ""}" placeholder="—">
        </div>`).join("")}
      <button class="btn mint" id="msave">Guardar</button>`,
      sheet => {
        sheet.querySelector("#msave").onclick = () => {
          const entry = { date: Dates.todayKey() };
          let any = false;
          sheet.querySelectorAll("[data-mid]").forEach(i => {
            const v = parseFloat(i.value);
            if (v > 0) { entry[i.dataset.mid] = v; any = true; }
          });
          if (!any) return UI.toast("Cargá al menos una medida");
          Store.s.measurements = Store.s.measurements.filter(m => m.date !== entry.date);
          Store.s.measurements.push(entry);
          Store.commit(); UI.closeSheet(); Router.render();
          UI.toast("Medidas guardadas 📏");
        };
      });
  },

  /* Editor de series de un ejercicio de la sesión de hoy */
  exercise(exId) {
    const ex = Ex.get(exId);
    const today = Dates.todayKey();
    let w = Workouts.byDate(today);
    const kgMode = ex.type === "kgreps";
    const saved = w?.exercises?.[exId]?.sets || [];
    const last = Workouts.lastSets(exId, today);
    const obs = w?.exercises?.[exId]?.obs || "";
    const sugKg = kgMode ? Plan.suggestKg(ex, today) : null;
    const nTarget = Plan.setsFor(ex, today);
    // Carga inicial: la de la fase (sugerida); en la fase 3, la de la última vez
    const defKg = kgMode
      ? ((Plan.phaseId(today) === 3 && last.length) ? (last[last.length - 1].kg ?? 0) : (sugKg ?? (last.length ? last[last.length - 1].kg : 0) ?? 0))
      : 0;
    const defV = last.length ? last[last.length - 1].v : (parseInt(ex.reps, 10) || (ex.type === "secs" ? 30 : 8));
    const sets = saved.length
      ? saved.map(s => ({ ...s }))
      : Array.from({ length: nTarget }, () => ({ kg: defKg, v: defV }));
    const unit = ex.type === "secs" ? "segundos" : "repeticiones";

    let tick = null, runIdx = -1, t0 = 0;
    const pull = () => {
      const sh = document.getElementById("sheet");
      sets.forEach((s, i) => {
        const v = sh.querySelector(`[data-stepper="v${i}"] input`);
        if (v) s.v = Math.max(0, +v.value || 0);
        const k = sh.querySelector(`[data-stepper="kg${i}"] input`);
        if (k) s.kg = Math.max(0, +k.value || 0);
      });
    };
    const render = () => {
      if (tick) { clearInterval(tick); tick = null; runIdx = -1; }
      const sheet = document.getElementById("sheet");
      sheet.innerHTML = `
        <div class="grab"></div>
        <h3>${ex.icon} ${ex.name}</h3>
        <p class="dimtext small" style="margin-top:-10px; margin-bottom:14px">${ex.cue}</p>
        <div class="coach" style="margin:0 0 16px">
          Objetivo: <em>${nTarget} × ${ex.reps || ""}</em>${sugKg != null ? ` · ~<em>${sugKg} ${ex.unit}</em>` : ""}
          ${last.length ? `<br>Última vez: <strong>${Ex.setText(ex, last)}</strong>${kgMode ? ` (${ex.unit} × reps)` : ""}` : ""}
        </div>
        <div class="eyebrow" style="margin-bottom:10px">Series${kgMode ? ` (${ex.unit} · repeticiones)` : ` (${unit})`}</div>
        <div id="setsbox">
          ${sets.map((s, i) => kgMode ? `
            <div style="display:grid; grid-template-columns:26px 1fr 1fr; gap:8px; align-items:center; margin-bottom:8px">
              <span class="idx">${i + 1}</span>
              ${UI.stepper("kg" + i, s.kg ?? 0, { min: 0, max: 500, step: ex.step || 1, label: `Carga serie ${i+1}` })}
              ${UI.stepper("v" + i, s.v, { min: 0, max: 999, label: `Repeticiones serie ${i+1}` })}
            </div>` : `
            <div class="setrow ${ex.type === "secs" ? "chrono" : "timed"}">
              <span class="idx">${i + 1}</span>
              ${UI.stepper("v" + i, s.v, { min: 0, max: 999, label: `Serie ${i+1}` })}
              ${ex.type === "secs" ? `<button type="button" class="tbtn" data-timer="${i}" aria-label="Cronometrar serie ${i+1}">⏱</button>` : ""}
            </div>`).join("")}
        </div>
        <div class="row" style="gap:10px; margin: 6px 0 16px">
          <button class="btn ghost small" id="addset">＋ Serie</button>
          ${sets.length > 1 ? `<button class="btn ghost small" id="rmset">− Serie</button>` : ""}
        </div>
        <div class="field">
          <label>Observaciones</label>
          <textarea id="obs" placeholder="Cómo se sintió, técnica…">${UI.esc(obs)}</textarea>
        </div>
        <button class="btn mint" id="exsave">Guardar ejercicio</button>
        ${w?.exercises?.[exId] ? `<button class="btn danger mt8" id="exclear">Quitar de la sesión</button>` : ""}`;

      UI.bindSteppers(sheet);
      // Cronómetro (solo ejercicios por tiempo): ⏱ arranca; ■ frena y guarda los segundos
      sheet.querySelectorAll("[data-timer]").forEach(btn => {
        btn.onclick = () => {
          const i = +btn.dataset.timer;
          const inp = sheet.querySelector(`[data-stepper="v${i}"] input`);
          if (runIdx === i) {
            clearInterval(tick); tick = null; runIdx = -1;
            btn.classList.remove("run"); btn.textContent = "⏱";
            sets[i].v = Math.max(0, +inp.value || 0);
            return;
          }
          if (tick) {
            clearInterval(tick);
            const prevBtn = sheet.querySelector(".tbtn.run");
            if (prevBtn) { prevBtn.classList.remove("run"); prevBtn.textContent = "⏱"; }
          }
          runIdx = i; t0 = Date.now();
          btn.classList.add("run"); btn.textContent = "■";
          inp.value = 0;
          tick = setInterval(() => {
            if (!document.body.contains(inp)) { clearInterval(tick); tick = null; return; }
            inp.value = Math.round((Date.now() - t0) / 1000);
          }, 250);
        };
      });
      sheet.querySelector("#addset").onclick = () => { pull(); const l = sets[sets.length - 1]; sets.push({ kg: l?.kg ?? 0, v: l?.v || 0 }); render(); };
      const rm = sheet.querySelector("#rmset");
      if (rm) rm.onclick = () => { pull(); sets.pop(); render(); };
      sheet.querySelector("#exsave").onclick = () => {
        if (tick) { clearInterval(tick); tick = null; }
        pull();
        const clean = sets.filter(s => s.v > 0).map(s => kgMode ? { kg: +s.kg || 0, v: s.v } : { v: s.v });
        if (!clean.length) return UI.toast(`Cargá al menos una serie con ${unit}`);
        const prevW = Workouts.sorted().filter(x => x.date < today && x.exercises?.[exId]?.sets?.length).pop();
        const before = prevW ? Workouts.metric(prevW, ex) : 0;
        if (!w) {
          w = { id: "w" + Date.now(), date: today, exercises: {} };
          Store.s.workouts.push(w);
        }
        w.exercises[exId] = { sets: clean, obs: document.getElementById("obs").value.trim() };
        const now = Workouts.metric(w, ex);
        Store.commit(); UI.closeSheet(); Router.render();
        if (before && now > before) UI.toast(`▲ +${Math.round(now - before)} vs. la sesión anterior 💪`);
        else UI.toast("Ejercicio guardado ✓");
        if (exId === "dominada") {
          const bestNow = Math.max(...clean.map(s => s.v));
          const bestPrev = Math.max(CONFIG.baseline.pullupReps, ...Pullup.repsHistory().filter(h => h.date !== today).map(h => h.reps));
          if (bestNow > bestPrev) setTimeout(() => UI.toast(`🏆 Nuevo récord de dominadas: ${bestNow}`), 2400);
        }
      };
      const clear = sheet.querySelector("#exclear");
      if (clear) clear.onclick = () => {
        delete w.exercises[exId];
        if (!Object.keys(w.exercises).length) Store.s.workouts = Store.s.workouts.filter(x => x.id !== w.id);
        Store.commit(); UI.closeSheet(); Router.render();
      };
    };

    UI.openSheet("", () => render());
  },

  /* Coach IA: analiza tu progreso real y ajusta la rutina de la semana */
  aiCoach(force = false) {
    if (!AI.hasKey()) {
      UI.openSheet(`
        <h3>🧠 Coach IA</h3>
        <p class="dimtext small" style="margin-bottom:14px">
          Lee tu progreso real (colgado, peso, sesiones, hábitos) y te devuelve una lectura honesta más el ajuste
          concreto de la próxima semana. Usa tu API key gratuita de Google AI Studio
          (<strong>aistudio.google.com</strong> → Get API key). La clave se guarda solo en este dispositivo.
        </p>
        <div class="field"><label>API key de Gemini</label><input type="password" id="gk1" placeholder="AIza…"></div>
        <button class="btn mint" id="gks">Guardar y analizar</button>`,
        sheet => {
          sheet.querySelector("#gks").onclick = () => {
            const v = sheet.querySelector("#gk1").value.trim();
            if (!v) return UI.toast("Pegá tu API key");
            Conn.set({ geminiKey: v });
            Sheets.aiCoach();
          };
        });
      return;
    }
    UI.openSheet(`
      <h3>🧠 Coach IA</h3>
      <div id="aiout" class="ai-out"><p class="dimtext">Analizando tu progreso…</p></div>
      <button class="btn ghost mt14" id="aire">↻ Actualizar análisis</button>`,
      async sheet => {
        sheet.querySelector("#aire").onclick = () => Sheets.aiCoach(true);
        try {
          const text = await AI.analyze(force);
          const out = sheet.querySelector("#aiout");
          if (out) out.innerHTML = AI.md(text);
        } catch (e) {
          const out = sheet.querySelector("#aiout");
          if (out) out.innerHTML = `<p class="dimtext">No pude obtener el análisis: ${UI.esc(e.message)}.<br>Revisá la API key en Ajustes ⚙︎ o probá de nuevo en un rato.</p>`;
        }
      });
  },

  settings() {
    const p = Store.s.profile;
    const c = Conn.get();
    UI.openSheet(`
      <h3>Ajustes</h3>
      <div class="grid2">
        <div class="field"><label>Peso inicial (kg)</label><input type="number" step="0.1" id="sw" value="${p.startWeight}"></div>
        <div class="field"><label>Peso objetivo (kg)</label><input type="number" step="0.1" id="tw" value="${p.targetWeight}"></div>
      </div>
      <div class="field"><label>Fecha objetivo</label><input type="date" id="td" value="${p.targetDateISO}"></div>
      <button class="btn" id="psave">Guardar ajustes</button>
      <h2 style="margin-left:0">Plan de entrenamiento</h2>
      <div class="field"><label>Inicio de la vuelta (fase 1)</label><input type="date" id="rd" value="${p.returnDate || ""}"></div>
      <p class="dimtext small" style="margin:-6px 0 8px">Las fases se calculan desde esta fecha: 2 semanas de reentrada, 2 de reconstrucción y después progresión. Vacío = todavía no empezó.</p>
      <button class="btn ghost" id="rdsave">Guardar fecha</button>
      <h2 style="margin-left:0">Coach IA (Gemini)</h2>
      <div class="field"><label>API key de Google AI Studio</label>
        <input type="password" id="gk" value="${UI.esc(c.geminiKey || "")}" placeholder="AIza…"></div>
      <p class="dimtext small" style="margin:-6px 0 4px">Gratis en aistudio.google.com. Se guarda solo en este dispositivo y habla directo con Google, sin intermediarios.</p>
      <h2 style="margin-left:0">Cuenta y nube (Supabase)</h2>
      ${Auth.user ? `
        <div class="item" style="border:none; padding-top:4px">
          <div class="ico">👤</div>
          <div class="body"><div class="name">${UI.esc(Auth.user.email)}</div>
          <div class="meta">Tus datos se sincronizan solos al cambiar algo</div></div>
        </div>
        <div class="grid2">
          <button class="btn ghost" id="push">☁️ Sincronizar ahora</button>
          <button class="btn ghost" id="pull">📥 Traer de la nube</button>
        </div>
        <button class="btn ghost mt8" id="logout">Cerrar sesión</button>
      ` : `
        <details class="mt8"><summary class="dimtext small">Conexión a la nube (avanzado)</summary>
          <div class="field mt8"><label>URL del proyecto</label>
            <input id="su" value="${UI.esc(c.supabaseUrl || "")}" placeholder="https://xxxx.supabase.co"></div>
          <div class="field"><label>Anon key (pública)</label>
            <input type="password" id="sk" value="${UI.esc(c.supabaseKey || "")}" placeholder="eyJ…"></div>
        </details>
        <div class="field"><label>Email</label><input type="email" id="em" autocomplete="email"></div>
        <div class="field"><label>Contraseña</label><input type="password" id="pw" autocomplete="current-password" placeholder="mínimo 6 caracteres"></div>
        <div class="grid2">
          <button class="btn mint" id="login">Entrar</button>
          <button class="btn ghost" id="signup">Crear cuenta</button>
        </div>
        <p class="dimtext small mt8">Cada cuenta ve solo sus datos. Creá tu cuenta una vez y entrá con la misma desde cualquier dispositivo.</p>
        <p class="dimtext small mt8">Sin cuenta, todo vive solo en este dispositivo — la app funciona igual.</p>
      `}
      <h2 style="margin-left:0">Tus datos</h2>
      <p class="dimtext small" style="margin-bottom:12px">Todo se guarda en este dispositivo. Exportá un respaldo para no perder nada o para migrar en el futuro.</p>
      <div class="grid2">
        <button class="btn ghost" id="exp">⬇️ Exportar</button>
        <label class="btn ghost" style="display:flex">⬆️ Importar<input type="file" accept=".json" hidden id="imp"></label>
      </div>
      <button class="btn danger mt14" id="wipe">Borrar todos los datos</button>
      ${!Storage.persistent ? `<p class="dimtext small center mt14">⚠️ Este entorno no permite guardar de forma permanente. Abrí el archivo en tu navegador o subilo a un hosting para que los datos persistan.</p>` : ""}`,
      sheet => {
        sheet.querySelector("#psave").onclick = () => {
          const sw = parseFloat(sheet.querySelector("#sw").value);
          const tw = parseFloat(sheet.querySelector("#tw").value);
          const td = sheet.querySelector("#td").value;
          if (sw > 0) p.startWeight = sw;
          if (tw > 0) p.targetWeight = tw;
          if (td) p.targetDateISO = td;
          Conn.set({ geminiKey: sheet.querySelector("#gk").value.trim() });
          const su = sheet.querySelector("#su"), sk = sheet.querySelector("#sk");
          if (su && sk) Conn.set({ supabaseUrl: su.value.trim(), supabaseKey: sk.value.trim() });
          Store.commit(); UI.closeSheet(); Router.render();
          UI.toast("Ajustes guardados");
        };

        sheet.querySelector("#rdsave").onclick = () => {
          Plan.setStart(sheet.querySelector("#rd").value || null);
          UI.closeSheet(); Router.render(); UI.toast("Plan actualizado");
        };

        if (Auth.user) {
          sheet.querySelector("#push").onclick = async () => {
            UI.toast("Sincronizando…");
            try { await Sync.push(); UI.toast("☁️ Sincronizado"); }
            catch (e) { UI.toast("No se pudo: " + e.message); }
          };
          sheet.querySelector("#pull").onclick = async () => {
            try {
              const row = await Sync.pull();
              if (!confirm(`Se va a reemplazar lo de este dispositivo por la nube (${new Date(row.updated_at).toLocaleString("es")}). ¿Seguimos?`)) return;
              Store.replace(row.data);
              UI.closeSheet(); Router.render();
              UI.toast("📥 Datos restaurados");
            } catch (e) { UI.toast("No se pudo: " + e.message); }
          };
          sheet.querySelector("#logout").onclick = () => { UI.closeSheet(); Session.signOut(); };
        } else {
          const doAuth = async mode => {
            Conn.set({
              supabaseUrl: sheet.querySelector("#su").value.trim(),
              supabaseKey: sheet.querySelector("#sk").value.trim(),
            });
            if (!Sync.configured()) return UI.toast("Cargá URL y anon key del proyecto");
            const email = sheet.querySelector("#em").value.trim();
            const pw = sheet.querySelector("#pw").value;
            if (!email || pw.length < 6) return UI.toast("Email y contraseña de 6+ caracteres");
            try {
              if (mode === "signup") {
                const j = await Auth.signUp(email, pw);
                if (!j.access_token) return UI.toast("Cuenta creada: confirmá desde tu email y volvé a entrar");
              } else {
                await Auth.signIn(email, pw);
              }
              UI.closeSheet();
              UI.toast("Sesión iniciada 👤");
              await Session.afterLogin();
            } catch (e) { UI.toast("No se pudo: " + e.message); }
          };
          sheet.querySelector("#login").onclick = () => doAuth("login");
          sheet.querySelector("#signup").onclick = () => doAuth("signup");
        }
        sheet.querySelector("#exp").onclick = () => Storage.exportJSON(Store.s);
        sheet.querySelector("#imp").onchange = e => {
          const f = e.target.files[0];
          if (f) Storage.importJSON(f, data => {
            Store.replace(data); UI.closeSheet(); Router.render();
            UI.toast("Datos importados ✓");
          });
        };
        sheet.querySelector("#wipe").onclick = () => {
          if (confirm("¿Seguro? Se borra todo: entrenos, peso, fotos y hábitos.")) {
            Store.reset(); UI.closeSheet(); Router.render();
          }
        };
      });
  },
};

/* ==========================================================================
   Router — navegación por pestañas
   ========================================================================== */
const Router = (() => {
  const tabs = [
    { id: "hoy", name: "Hoy", icon: `<svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9h13v-9"/></svg>` },
    { id: "entreno", name: "Entreno", icon: `<svg viewBox="0 0 24 24"><path d="M2 12h3M19 12h3M6 8v8M18 8v8M9 6v12M15 6v12M9 12h6"/></svg>` },
    { id: "comidas", name: "Comidas", icon: `<svg viewBox="0 0 24 24"><path d="M7 3v7a2 2 0 0 0 2 2v9M7 3v5M11 3v5M17 3c-2 1.5-3 4-3 7h3v11"/></svg>` },
    { id: "habitos", name: "Hábitos", icon: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5 11 15.5 16.5 9"/></svg>` },
    { id: "progreso", name: "Progreso", icon: `<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>` },
  ];
  let current = "hoy", sub = null;

  function renderTabs() {
    const box = document.getElementById("tabs");
    box.innerHTML = tabs.map(t => `
      <button data-tab="${t.id}" class="${t.id === current ? "active" : ""}" aria-label="${t.name}" ${t.id === current ? 'aria-current="page"' : ""}>
        ${t.icon}<span>${t.name}</span>
      </button>`).join("");
    box.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => go(b.dataset.tab));
  }
  function render() {
    if (Gate.locked()) return Gate.show();
    Gate.hide();
    renderTabs();
    Screens[current](document.getElementById("app"), sub);
    window.scrollTo({ top: 0 });
  }
  function go(tab, s = null) { current = tab; sub = s; render(); }

  return { render, go, get current() { return current; } };
})();

/* ==========================================================================
   Init
   ========================================================================== */
(function init() {
  // Registrar SW si el archivo está servido por HTTP (para instalar como PWA)
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    const swCode = `
      const C = "vform-v1";
      self.addEventListener("install", e => { self.skipWaiting(); });
      self.addEventListener("activate", e => e.waitUntil(clients.claim()));
      self.addEventListener("fetch", e => {
        e.respondWith(caches.open(C).then(async cache => {
          try { const res = await fetch(e.request); cache.put(e.request, res.clone()); return res; }
          catch (_) { return cache.match(e.request); }
        }));
      });`;
    try {
      navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode], { type: "text/javascript" })))
        .catch(() => {});
    } catch (_) {}
  }
  if (!Storage.persistent) {
    setTimeout(() => UI.toast("Vista previa: los datos no se guardan acá"), 800);
  }

  // Multi-dispositivo: cada cambio se sube solo (debounce) si hay sesión,
  // y al arrancar se baja la nube si es más nueva que lo local
  let pushT = null;
  Store.subscribe(() => {
    if (!Auth.user || !Sync.configured()) return;
    clearTimeout(pushT);
    pushT = setTimeout(() => Sync.push().catch(() => {}), 4000);
  });
  if (Auth.user && Sync.configured()) {
    Sync.pull().then(row => {
      if ((row.data?.updatedAt || "") > (Store.s.updatedAt || "")) {
        Store.replace(row.data);
        Router.render();
        UI.toast("☁️ Sincronizado desde la nube");
      }
    }).catch(() => {});
  }

  Router.render();
})();
</script>
<script>
// Instalable y con respaldo sin conexión (solo cuando se sirve por http/https)
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
